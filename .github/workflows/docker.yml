name: Publish container

# Builds a new container image only from main: direct pushes and PR merges.
# Image: ghcr.io/trueal82/transcortex.dev (tags: latest, sha, main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render static site
        run: python3 build.py

      - name: Verify rendered pages
        run: python3 .github/check-site.py

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image (zero logging guarantee)
        run: |
          docker run -d --name site -p 8080:8080 ${{ env.IMAGE }}:sha-${{ github.sha }}
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          [ "${code}" = "200" ] || { echo "FAIL: / returned ${code}"; exit 1; }
          bytes=$(docker logs site 2>&1 | wc -c)
          [ "${bytes}" -eq 0 ] || { echo "FAIL: container logged ${bytes} bytes"; docker logs site; exit 1; }