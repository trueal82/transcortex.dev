<!doctype html>
<html lang="{lang}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <meta name="description" content="{description}">
  <meta name="robots" content="index, follow">
    {alternates}
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main-content">{skip_label}</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{home_url}">Trans<span>cortex</span> Labs</a>
      <nav class="site-nav desktop-nav" aria-label="{nav_label}">
        {nav}
      </nav>
      <details class="mobile-navigation">
        <summary>{menu_label}</summary>
        <nav class="site-nav" aria-label="{nav_label}">{nav}</nav>
      </details>
      <div class="lang-switch">
        {lang_switch}
      </div>
    </div>
  </header>

  <main class="container" id="main-content">
    {breadcrumbs}
    {content}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-note">{footer_note}</p>
      <p class="footer-legal">{footer_nav}</p>
      <p class="footer-contact">
        {contact}
      </p>
    </div>
  </footer>
</body>
</html>
