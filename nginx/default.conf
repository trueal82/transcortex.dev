# transcortex.dev — site server block.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Privacy hardening: same-origin only, never leak referrers.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Retired company routes redirect directly to the current page.
    location = /ueber-mich { return 301 /unternehmen/; }
    location = /ueber-mich/ { return 301 /unternehmen/; }
    location = /team     { return 301 /unternehmen/; }
    location = /team/    { return 301 /unternehmen/; }
    location = /en/team  { return 301 /en/about/; }
    location = /en/team/ { return 301 /en/about/; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted-ish static assets (single-site fonts/css change rarely).
    location /assets/fonts/ {
        expires max;
    }

    location /assets/ {
        expires 1d;
    }
}