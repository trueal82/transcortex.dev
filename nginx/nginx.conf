# transcortex.dev — main nginx config.
# Logging is disabled entirely: even the error log goes to /dev/null.
# Runs unprivileged (uid 101) in the nginx-unprivileged image, port 8080.

worker_processes auto;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # No logging at all.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Temp paths inside the writable cache dir of the unprivileged image.
    client_body_temp_path  /var/cache/nginx/client_temp;
    proxy_temp_path        /var/cache/nginx/proxy_temp;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp;
    scgi_temp_path         /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json;

    include /etc/nginx/conf.d/*.conf;
}